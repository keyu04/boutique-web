<main class="wrap">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="mark">{{ brand.name }}</p>
    <h1>Sign in</h1>
    <p class="sub">Store admin</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="username"
             [attr.aria-invalid]="bad('email')" />
      @if (bad('email')) { <p class="err">Enter a valid email address.</p> }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password"
             autocomplete="current-password" [attr.aria-invalid]="bad('password')" />
      @if (bad('password')) { <p class="err">Enter your password.</p> }
    </div>

    @if (error(); as e) { <p class="err" role="alert">{{ e }}</p> }

    <button type="submit" class="btn" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
